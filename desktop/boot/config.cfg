set default=0
set timeout=10
set timeout_style=menu

# GRUB's own font for anything the theme doesn't cover, and Inter for the menu (build.sh makes
# the inter-*.pf2 files).
if [ x$feature_default_font_path = xy ] ; then
	font=unicode
else
	font=$prefix/unicode.pf2
fi
loadfont $font
for f in inter-regular-16 inter-regular-20 inter-regular-24 inter-bold-16 inter-bold-20 inter-bold-24 ; do
	loadfont $prefix/$f.pf2
done

# UEFI: the screen's own resolution. BIOS: "auto" can pick a mode too small for the menu's font,
# so ask for 1024x768 (which BIOS graphics nearly always has) first.
if [ "${grub_platform}" = "efi" ]; then
	set gfxmode=auto
else
	set gfxmode=1024x768,800x600,auto
fi
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
