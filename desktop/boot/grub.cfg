source /boot/grub/config.cfg

# XenithOS Desktop's boot menu (the USB stick). live-build fills in the @...@ parts.

menuentry "Start XenithOS Desktop" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Install XenithOS Desktop" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ xenithos.install
	initrd	@INITRD_LIVE@
}

submenu "More options" --hotkey=m {
	source /boot/grub/theme.cfg

	menuentry "Start with safe graphics" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
		initrd	@INITRD_LIVE@
	}

	menuentry "Install with safe graphics" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset xenithos.install
		initrd	@INITRD_LIVE@
	}

	# Always there: build.sh makes the list of sums it checks against (live-build's own switch
	# for this entry would hide it, because its own list is turned off).
	menuentry "Check the USB stick for errors" {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "PC's firmware settings (UEFI)" {
			fwsetup
		}
	fi
}
