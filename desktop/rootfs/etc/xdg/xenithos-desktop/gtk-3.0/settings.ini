# XenithOS Desktop's look for programs that start without the desktop's own settings service:
# Settings opened from XenithOS Console, and the installer. (On the desktop the same comes from
# xfconf's xsettings.) It lives here and not in /etc/gtk-3.0, which is Ubuntu's own file.
[Settings]
gtk-theme-name=XenithOS
gtk-icon-theme-name=XenithOS
gtk-font-name=Inter 10
gtk-application-prefer-dark-theme=true
