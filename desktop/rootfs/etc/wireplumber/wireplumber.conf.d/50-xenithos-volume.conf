# XenithOS Desktop: speakers and headphones start at 85% the first time they're used, not
# WirePlumber's own 40%, which is very quiet on most PCs. (The value is the volume cubed:
# 0.85 x 0.85 x 0.85.) Each device's volume is remembered after that.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.614
}
