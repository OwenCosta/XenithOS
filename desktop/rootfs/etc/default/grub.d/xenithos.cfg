# XenithOS Desktop: no boot menu, straight to the start-up screen. Hold Shift (BIOS) or press Esc
# (UEFI) as the PC starts to see the menu.
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 udev.log_level=3 vt.global_cursor_default=0"
GRUB_DISABLE_OS_PROBER=true
# After a start that didn't finish (the power went while it was starting, say), Ubuntu's GRUB
# shows its menu for 30 seconds before it carries on. Three are enough to pick another entry.
GRUB_RECORDFAIL_TIMEOUT=3

# The menu's entries say XenithOS. For everything else GRUB keeps the name of the system
# underneath (Ubuntu): that's the name of the folder on the EFI partition where its signed boot
# loader looks for its files, so GRUB's own updates must keep installing there.
case "$0" in
    *grub-mkconfig*) GRUB_DISTRIBUTOR="XenithOS" ;;
    *)
        GRUB_DISTRIBUTOR=$(sed -n 's/^Vendor: *//p' /etc/dpkg/origins/default 2>/dev/null | head -n 1)
        [ -n "$GRUB_DISTRIBUTOR" ] || GRUB_DISTRIBUTOR=Ubuntu
        ;;
esac
