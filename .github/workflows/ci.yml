# XenithOS's checks: the PC version built as Ubuntu 24.04 and Debian 12 build it, the simulator with
# every script in sim/scripts, XenithOS Cloud's self-tests, MineNest's tests and the Xbox 360 build.
# Each step runs the same commands as on a PC (README.md, "Checks").
#
# On every push to a branch and every pull request, and twice a week, which keeps the Xbox
# toolchain in the cache (GitHub drops a cache nobody has used for a week, and building it again
# takes about an hour). Not when a tag moves: desktop-stable and desktop-2-stable are tags that
# installed PCs update from, and they point at commits that were checked on their branch.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1,4"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  pc:
    name: PC build, ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            runner: ubuntu-24.04
          - name: Debian 12
            image: debian:12
            runner: ubuntu-24.04
          - name: Debian 12 on ARM (Raspberry Pi OS)
            image: debian:12
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libsdl2-dev libx11-dev zlib1g-dev > /dev/null
      - name: Compiler
        run: |
          gcc --version | head -n 1
          echo "SDL $(sdl2-config --version)"
          fortify=$(echo | gcc -O2 -dM -E - | sed -n 's/^#define _FORTIFY_SOURCE //p')
          echo "_FORTIFY_SOURCE at -O2: ${fortify:-off}"
          # Ubuntu's gcc builds with _FORTIFY_SOURCE=3, which is what stopped HostMC (now MineNest) on real PCs
          # (a realpath buffer smaller than PATH_MAX). If that changes, this build stops proving it.
          if grep -qx 'ID=ubuntu' /etc/os-release && [ "$fortify" != 3 ]; then
            echo "::error::Ubuntu 24.04's gcc should build with _FORTIFY_SOURCE=3"
            exit 1
          fi
      - name: make -C linux
        run: make -C linux -j"$(nproc)" 2>&1 | tee build.log
      - name: Warnings
        if: success() || failure()
        run: .github/warnings.sh linux "the PC version (${{ matrix.name }})" < build.log

  simulator:
    name: Simulator, every script (ASan, UBSan, tiled framebuffer)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zlib1g-dev > /dev/null
      - name: make -C sim
        run: make -C sim -j"$(nproc)" 2>&1 | tee build.log
      - name: Warnings
        if: success() || failure()
        run: .github/warnings.sh sim "the simulator" < build.log
      - name: sim/test-scripts.sh
        run: sim/test-scripts.sh
      - name: Screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator
          path: sim/out/
          retention-days: 7
          if-no-files-found: ignore

  selftests:
    name: Self-tests, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"]      # Ubuntu 24.04's, and the newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: XenithOS Cloud
        run: python3 server/xenith_cloud.py --selftest
      - name: XenithOS Cloud's relay
        run: python3 server/xenith-relay.py --selftest

  minenest:
    name: MineNest, ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [linux/test-minenest.sh, sim minenest.txt]
    env:
      TEST: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends             libsdl2-dev libx11-dev zlib1g-dev xvfb xdotool x11-apps imagemagick golang-go > /dev/null
      - name: MineNest's own program (github.com/OwenCosta/minenest, main)
        run: |
          # Ubuntu's Go fetches the Go version MineNest's go.mod asks for by itself (GOTOOLCHAIN).
          git clone --depth 1 https://github.com/OwenCosta/minenest.git "$RUNNER_TEMP/minenest"
          (cd "$RUNNER_TEMP/minenest" && go build -o "$RUNNER_TEMP/bin/minenest" ./cmd/minenest)
          echo "MINENEST_BIN=$RUNNER_TEMP/bin/minenest" >> "$GITHUB_ENV"
      - name: Build
        run: |
          case "$TEST" in
            linux/*) make -C linux -j"$(nproc)" xenithos minenest ;;   # with Ubuntu's _FORTIFY_SOURCE=3
            *) make -C sim -j"$(nproc)" xminenest ;;
          esac
      - name: ${{ matrix.test }}
        run: |
          case "$TEST" in
            linux/*) ./"$TEST" ;;
            *) XSIM_BIN=xminenest XSIM_KIND=pc XSIM_THREAD=1 XSIM_MINENEST=1 XSIM_TYPE="say Hello from MineNest|"                  sim/run.sh sim/scripts/minenest.txt minenest ;;
          esac
      - name: Screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minenest-${{ strategy.job-index }}
          path: |
            /tmp/xos-minenest/
            sim/out/
          retention-days: 7
          if-no-files-found: ignore

  xbox:
    name: Xbox 360 build (libxenon)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # The libxenon the toolchain is built from (README.md, "Building"), and the filesystem
      # libraries its build-xenon-toolchain would clone. A new one builds a new toolchain.
      LIBXENON: 1334a0ff48c467974b84cdf5927352196cc33eab
      FAT_XENON: 0f2092a9a86026e07e903b596c903c1629159762
      EXT2FS_XENON: 568ba309a5d742938880f2ad21afe7332d43246f
      XTAFLIB: f1cc0b9971f9e11f0f3ce92f7a78b7449168c362
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The toolchain, from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xenon
          key: xenon-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBXENON }}-${{ env.FAT_XENON }}-${{ env.EXT2FS_XENON }}-${{ env.XTAFLIB }}-1
      - name: Build the toolchain (only when it isn't cached, about an hour)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev texinfo git wget gcc-multilib > /dev/null
          git clone -q https://github.com/Free60Project/libxenon "$RUNNER_TEMP/libxenon"
          git -C "$RUNNER_TEMP/libxenon" checkout -q "$LIBXENON"
          cd "$RUNNER_TEMP/libxenon/toolchain"
          # Already there at these commits, so its "filesystems" step builds them as they are.
          for lib in "fat-xenon $FAT_XENON" "ext2fs-xenon $EXT2FS_XENON" "xtaflib $XTAFLIB"; do
            set -- $lib
            git clone -q "https://github.com/Free60Project/$1" "$1"
            git -C "$1" checkout -q "$2"
          done
          export PREFIX="$HOME/xenon" FREE60_DOCKER_BUILD=true      # (the packages are in already)
          for step in toolchain libxenon filesystems zlib; do
            echo "::group::build-xenon-toolchain $step"
            ./build-xenon-toolchain "$step" || { tail -n 100 build.log; exit 1; }
            echo "::endgroup::"
          done
          # The programs that run here, not the PowerPC libraries.
          find "$HOME/xenon/bin" "$HOME/xenon/libexec" -type f -perm -u+x -exec strip --strip-unneeded {} + 2>/dev/null || true
          du -sh "$HOME/xenon"
          "$HOME/xenon/bin/xenon-gcc" --version | head -n 1
      - name: Keep the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xenon
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: ./build.sh
        run: ./build.sh 2>&1 | tee build.log
      - name: Warnings
        if: success() || failure()
        run: .github/warnings.sh . "the Xbox 360 build" < build.log
